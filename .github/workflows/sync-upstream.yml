name: Sync from upstream

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}     # lets you trigger manually too

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/skat/dms-public.git || true

      - name: Fetch upstream and detect its default branch
        id: fetch
        run: |
          git fetch upstream
          UP_BRANCH=$(git remote show upstream | sed -n 's/.*HEAD branch: //p')
          echo "Upstream default branch: $UP_BRANCH"
          echo "branch=$UP_BRANCH" >> $GITHUB_OUTPUT
          git branch -r

      - name: Check for changes
        id: check
        run: |
          if git merge-base --is-ancestor upstream/${{ steps.fetch.outputs.branch }} HEAD; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git merge upstream/${{ steps.fetch.outputs.branch }} --ff-only
          git push origin HEAD
